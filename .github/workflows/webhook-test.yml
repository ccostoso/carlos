name: Test Webhook.site

on:
  workflow_dispatch:

jobs:
  send-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Send POST Request to Webhook.site
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_SITE_URL }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d '{"event": "GitHub Action Triggered", "repo": "${{ github.repository }}", "status": "Success"}'
